<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="#070819"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="300" fill="#bb3417"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b8fa8" letter-spacing="2">
    <text x="56" y="50">01 / OPEN SOURCE</text>
    <text x="1144" y="50" text-anchor="end">PYTHON · MIT · MADAGASCAR</text>
  </g>
  <line x1="56" y1="68" x2="1144" y2="68" stroke="#ffffff" stroke-opacity="0.12"/>

  <text x="54" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" fill="#f3f1ec" font-weight="600">mobile-money-mg</text>
  <text x="56" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b9bccd">Une API pour les trois opérateurs. <tspan font-style="italic" fill="#bb3417">Un seul code.</tspan></text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">
    <rect x="56" y="222" width="110" height="30" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="111" y="241" text-anchor="middle" fill="#f3f1ec">MVOLA</text>
    <rect x="178" y="222" width="150" height="30" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="253" y="241" text-anchor="middle" fill="#f3f1ec">ORANGE MONEY</text>
    <rect x="340" y="222" width="150" height="30" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="415" y="241" text-anchor="middle" fill="#f3f1ec">AIRTEL MONEY</text>
    <line x1="502" y1="237" x2="740" y2="237" stroke="#bb3417" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M740 231 L750 237 L740 243 Z" fill="#bb3417"/>
    <rect x="762" y="222" width="150" height="30" fill="none" stroke="#bb3417"/>
    <text x="837" y="241" text-anchor="middle" fill="#f3f1ec">mm.pay(…)</text>
    <text x="1144" y="241" text-anchor="end" fill="#8b8fa8">pip install mobile-money-mg</text>
  </g>
