[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mobile-money-mg"
version = "0.1.0"
description = "One Python API for MVola, Orange Money and Airtel Money in Madagascar — payments, status, webhooks and an offline simulator."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aina Finaritra Rakotonindrainy", email = "aina.finaritra.rak@gmail.com" }]
keywords = ["mvola", "orange money", "airtel money", "mobile money", "madagascar", "payments", "fintech", "africa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/finaritrak/mobile-money-mg"
Issues = "https://github.com/finaritrak/mobile-money-mg/issues"
Changelog = "https://github.com/finaritrak/mobile-money-mg/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_money_mg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["mobile_money_mg"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
